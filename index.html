<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metacritic RPG</title>
<style>
:root{--bg:#fff;--panel:#f2f2f2;--text:#111;--muted:#666;--line:#ddd;--hdr:#000;--logo:#ffbd3f;--green:#00ce7a;--yellow:#ffbd3f;--red:#ff6874;--link:#0b5fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--panel:#1b1b1b;--text:#f2f2f2;--muted:#9a9a9a;--line:#2b2b2b;--link:#6aa0ff}}
:root[data-theme="dark"]{--bg:#0d0d0d;--panel:#1b1b1b;--text:#f2f2f2;--muted:#9a9a9a;--line:#2b2b2b;--link:#6aa0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Helvetica,Arial,sans-serif;line-height:1.4}
header{background:var(--hdr);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
header a{color:var(--logo);font-weight:800;font-size:26px;text-decoration:none;letter-spacing:.5px}
.logo img{height:52px;width:auto;display:block}
header span{color:#bbb;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:20px;margin:28px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{text-decoration:none;color:inherit;display:block}
.cover{aspect-ratio:1/1;width:100%;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:34px;background:linear-gradient(135deg,#444,#111)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.card .t{font-weight:700;font-size:14px}
.card .a{color:var(--muted);font-size:13px}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:4px;color:#000;font-weight:800;font-size:16px;flex:none}
.score.big{min-width:76px;height:76px;font-size:38px;border-radius:6px}
.g{background:var(--green)}.y{background:var(--yellow)}.r{background:var(--red)}
.album{display:grid;grid-template-columns:260px 1fr;gap:28px}
@media(max-width:700px){.album{grid-template-columns:1fr}}
.top{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin:14px 0}
.verdict{font-weight:700;font-size:18px}
.dist{background:var(--panel);border-radius:6px;padding:14px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.row .lab{width:90px}.bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%}
.row .n{width:28px;text-align:right;font-weight:700}
.rev{border-bottom:1px solid var(--line)}
.rev summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 0;cursor:pointer}
.rev summary::-webkit-details-marker{display:none}
.rev .arrow{margin-left:auto;color:var(--muted);font-size:18px;transition:transform .2s}
.rev[open] .arrow{transform:rotate(180deg)}
.rev .txt{padding:0 0 10px;white-space:pre-line;line-height:1.55}
.rev .fn{padding:0 0 18px;font-weight:700}
.rev .pub{font-weight:700}

.back{color:var(--link);text-decoration:none;font-size:14px}
</style>
</head>

G1AdoIIbm3258yTLGuVIx5TZZjIseg1I27QosI7u4m1Tj4+1hzkmY8++Zfp1jBM2mMf7x0WPNI6gvX1ht9mpEwULcmbyVHAe6oCWUYP8fC1tcW/ou64mYOCy0cLrsgxiw85rd/WFk2CoOdVHD1W2DXCAjJanpjk+zuUnFo6QJy9tFI3FCAHsz/ShveiOs0sZvmTjRHL+jRCru1W4UrQAioGofEmc1j1ZNwzyoU92mnRRncn8IskK2ZBHbmVazQ8PgiDZzq/zdXr/G6Pb3W4LGDJR3kDt+qxyViM/xPX1c4iPTYk3nvDcSN3z4If8A2QY2uyXoSMPhPc9NXU/JlW6Y8NLoQyJp4dhPw3Zffm+AiKN0IA7waBha8V+Vh+BPrhJ5sz5zgMZ5cBtczf9vX5uCjZmn9ZROdEdhK3RN6A/mtFR5NMFyZ53w3CgfpvxrL+Alc6NzgAAA=", "reviews": [{"pub": "Rolling Stone", "score": 80, "text": "Em “SWEET TALK”, YAZ encontra no R&B contemporâneo um terreno fértil para explorar as contradições dos relacionamentos modernos. Entre a autoconfiança e a insegurança, o desejo e o distanciamento emocional, a cantora apresenta um repertório de 14 faixas que privilegia a atmosfera e a sensualidade, sem abandonar uma abordagem mais vulnerável sobre o amor.\n\nOs singles “Right Back!” e “Don’t Tell Me You Love Me” representam bem as diferentes facetas do projeto. O primeiro se destaca pela atitude e pelo apelo imediato, enquanto o segundo apresenta uma perspectiva mais reservada, marcada pela desconfiança diante de promessas românticas. Juntas, as canções estabelecem uma identidade que se desenvolve ao longo do disco, ainda que nem sempre com a mesma intensidade.\n\nA influência do R&B dos anos 2000 aparece em diferentes momentos, especialmente em “Get It Till I’m Gone”, “Check” e “Girls Go Crazy”. YAZ demonstra familiaridade com essa linguagem musical, encontrando um equilíbrio interessante entre referências nostálgicas e uma produção contemporânea. Em contrapartida, algumas faixas se aproximam tanto em estrutura e atmosfera que acabam disputando o mesmo espaço dentro do repertório, tornando determinados trechos menos memoráveis do que poderiam ser.\n\nHá também uma diferença perceptível entre as composições que apresentam uma personalidade mais definida e aquelas que dependem principalmente de sua estética sonora. “crash & burn” e “Pleasure” estão entre os momentos em que a proposta ganha maior profundidade, enquanto outras passagens parecem satisfeitas em preservar o clima do álbum sem necessariamente acrescentar novas perspectivas. Essa irregularidade não compromete o conjunto, mas impede que todas as 14 faixas alcancem o mesmo nível de relevância.\n\nAinda assim, seria injusto reduzir “SWEET TALK” às suas limitações. Existe uma direção artística clara por trás do projeto, particularmente na escolha de explorar a intimidade sem transformar cada composição em uma grande declaração sentimental. A cantora compreende o valor da contenção e demonstra que uma interpretação convincente nem sempre depende de excessos.\n\nO resultado é um álbum que funciona melhor como experiência completa do que como uma simples reunião de potenciais sucessos. Sua consistência estética é uma qualidade evidente, embora uma seleção mais criteriosa do repertório pudesse favorecer o ritmo e ampliar o impacto de suas melhores composições.\n\nCom “SWEET TALK”, YAZ apresenta um trabalho seguro de suas intenções, capaz de dialogar com as tendências atuais do R&B sem perder de vista suas principais influências. Não é um disco livre de escolhas previsíveis, mas possui personalidade suficiente para sustentar suas ambições e despertar interesse pelos próximos passos da cantora."}, {"pub": "Pitchfork", "score": 75, "text": "Em seu álbum de estreia, Sweet Talk, Yaz apresenta um trabalho que demonstra uma boa compreensão das possibilidades do R&B contemporâneo. Com produções suaves, melodias envolventes e uma direção sonora bastante consistente, o disco estabelece uma identidade musical clara, equilibrando elementos tradicionais do gênero com uma sonoridade mais acessível e voltada ao mainstream.\n\nEsse equilíbrio aparece especialmente em faixas como “Don’t Tell Me You Love Me” e “Crash and Burn”, dois dos grandes destaques do projeto. Ambas conseguem explorar o R&B de maneira envolvente, apostando em melodias marcantes e refrões que poderiam facilmente encontrar espaço nas rádios. São músicas que demonstram o potencial comercial de Yaz sem abrir mão da identidade musical que ela procura construir.\n\nUm dos maiores méritos de Sweet Talk é justamente sua coesão. O álbum soa como um projeto cuidadosamente pensado, no qual as faixas compartilham uma atmosfera e uma direção artística bem definidas. Existe uma unidade entre as músicas que torna a experiência bastante agradável inicialmente. Entretanto, essa consistência acaba se tornando uma limitação à medida que o disco avança.\n\nDa metade para o final, Sweet Talk começa a perder um pouco do fôlego. As músicas passam a soar semelhantes demais, e aquilo que antes funcionava como uma identidade coesa começa a se transformar em certa monotonia. Não necessariamente pela falta de qualidade das composições, mas pela ausência de momentos que realmente renovem a experiência do ouvinte. Em determinados momentos, o álbum se torna cansativo e até um pouco entediante.\n\nFelizmente, as duas últimas faixas conseguem recuperar parte do interesse perdido, trazendo novamente a energia e o envolvimento que fizeram os primeiros momentos do disco funcionarem tão bem. É um encerramento que ajuda a resgatar a proposta do projeto e deixa uma impressão mais positiva do que aquela que o trecho intermediário poderia sugerir.\n\nNo fim, Sweet Talk é um bom álbum de R&B e uma estreia promissora para Yaz. Embora não consiga sustentar o mesmo nível de interesse durante toda a sua duração, o disco apresenta uma identidade bem estabelecida, boas escolhas musicais e, principalmente, canções que demonstram potencial para alcançar um público além do gênero. Yaz ainda tem espaço para amadurecer artisticamente, mas seu primeiro trabalho mostra que existe algo interessante sendo construído aqui."}, {"pub": "Billboard", "score": 82, "text": "Sweet Talk é uma estreia pop bastante competente, que encontra no cruzamento entre melodias de R&B, vocais suaves e produções minimalistas sua principal identidade. Longe de tentar reinventar a roda, Yaz demonstra uma compreensão interessante de suas referências, apostando em arranjos econômicos, linhas de baixo bem delineadas e uma sonoridade que privilegia o groove em vez de grandes explosões instrumentais. É um trabalho que entende que, às vezes, menos é mais — uma lição que boa parte da indústria pop parece ter esquecido.\n\nA coesão é um dos maiores trunfos do projeto. As faixas conversam entre si e sustentam uma direção sonora consistente, sem parecer uma coleção aleatória de tentativas de encontrar um hit. Entretanto, essa mesma uniformidade acaba se tornando uma faca de dois gumes. Na região intermediária do álbum, a recorrência das mesmas texturas, dinâmicas e escolhas de produção começa a cobrar seu preço, tornando a experiência ligeiramente monótona. O minimalismo funciona, mas não precisa ser confundido com ausência de variação.\n\nÉ em “Get It Till I’m Gone” e “Check” que Sweet Talk realmente encontra seu melhor momento. Ambas apresentam uma combinação particularmente eficiente entre a estrutura melódica do pop e a construção rítmica do R&B, com graves mais presentes, grooves envolventes e uma atmosfera que confere ao disco o frescor que falta em boa parte dos lançamentos contemporâneos do gênero. São músicas que demonstram como a simplicidade, quando acompanhada de boas decisões de produção, pode ser muito mais interessante do que uma parede de sintetizadores disputando espaço na mixagem.\n\nHá, naturalmente, limitações. O repertório poderia explorar mais nuances vocais e variações de andamento, enquanto algumas composições parecem satisfeitas demais em permanecer dentro de sua zona de conforto. Ainda assim, seria excessivamente rigoroso cobrar de uma artista em estreia a maturidade de quem já possui uma discografia consolidada. Yaz apresenta personalidade, controle estético e, principalmente, uma boa noção de direção artística.\n\nSweet Talk não é uma revolução pop, tampouco precisa fingir ser. É um debut seguro, agradável e tecnicamente bem executado, que encontra sua força na combinação entre pop e R&B sem recorrer a fórmulas excessivamente saturadas. Se falta um pouco de ousadia para transformar um bom disco em algo realmente memorável, sobra competência para indicar que Yaz tem motivos de sobra para ser acompanhada daqui em diante."}, {"pub": "NME", "score": 85, "text": "Sweet Talk é uma seleção que demonstra uma compreensão interessante do R&B feminino contemporâneo. O Album constrói um universo musical que transita entre sensualidade, relacionamentos, vulnerabilidade emocional, autoconfiança e liberdade.\n\nO repertório cria uma combinação de referências que aproxima o projeto de uma estética internacional, especialmente da nova geração do R&B e do pop alternativo.\n\nO grande mérito de Sweet Talk é sua atmosfera. Existe uma proposta relativamente clara: apresentar uma experiência musical moderna, feminina, envolvente e com uma identidade noturna.\n\nMas o álbum também apresenta algumas limitações que merecem atenção.\n\nAnálise dos momentos do Álbum\n\nIntrodução emocional\nA escolha de intro (end of the world), é interessante. A faixa estabelece uma atmosfera introspectiva e prepara o ouvinte para um projeto que parece explorar sentimentos e relacionamentos.\nEm seguida, Don’t Tell Me You Love Me, e Right Back!, ajudam a desenvolver essa atmosfera, trazendo diferentes perspectivas do R&B contemporâneo.\n\nA transição para o pop/R&B\nGet It Till I’m Gone, é uma escolha importante. representa muito bem a combinação entre R&B tradicional, harmonias vocais e pop moderno.\nPlans Tonight, e crash & burn, acrescentam diversidade e ajudam a evitar que a seleção fique excessivamente uniforme.\n\nO núcleo sensual e alternativo\nDOWN BAD e Late Night Talking, reforçam a personalidade noturna do Álbum.\nAqui está uma das partes mais interessantes da seleção: o projeto parece encontrar seu território entre o R&B sensual, o pop alternativo e uma sonoridade mais intimista.\nPleasure, também contribui bastante para essa direção.\nunder the rug, acrescenta uma dimensão mais alternativa.\nCheck, recupera a energia pop, enquanto Girls Go Crazy, amplia a sensação de diversão e atitude.\nA presença de Top Of The Line, é especialmente interessante,\nPor fim, W1LL U L13?, fecha a sequência com uma referência que combina com a temática de relacionamentos e conflitos emocionais\n\nSweet Talk demonstra bom gosto musical, referências bem escolhidas e uma direção estética reconhecível. É uma Album que consegue transmitir uma atmosfera e sugerir uma personalidade musical.\n\nMinha crítica principal é que existe uma diferença entre construir uma excelente seleção de músicas e construir um álbum verdadeiramente memorável. O álbum está bem encaminhada no primeiro aspecto, mas ainda precisaria de mais personalidade autoral, unidade narrativa e momentos musicais inesquecíveis para alcançar uma nota acima de 90.\n\nConclusão: Sweet Talk é uma seleção sofisticada, contemporânea e comercialmente interessante. Tem potencial para agradar ao público que acompanha a nova geração do R&B, especialmente quem procura sonoridades femininas, sensuais e alternativas."}]}, {"id": "s-w-a-v-e", "title": "S.W.A.V.E.", "artist": "Ben Fryez", "date": "2022-03-04", "genre": "Rap", "cover": "data:image/webp;base64,UklGRgxfAABXRUJQVlA4IABfAADQ6gGdASpYAlgCPlEmkEajoiGpohNaCTAKCWluvimJdzYFsNHN2QyEX2o8Guxj6mdyLzor5x45/mfX/+efef8z83PZm/5PIP2n/7PRD+f/o7+Z/lv3e+MXcTwF/dv/F/NHkFAE/Yn/hfdN8Jv5v/o9QPtt94H0Cf0b+v/8P2L/9Hkbfkv+h/2/9l8BH9K/wn/G/w37uf7r6f/9j/1/6780vfZ+w/7T/0f7D4C/59/af+p/if8576X//91n7w+yL+zn//Gsw2G3R5QsEY9Fwg2CItixOYalBGVwIfIQZYl8b1L/HyD5aJuZ4glyUoT92tTJEua+s/fpTyvtmTiL3cwQ+QgW/95Kd7IMP3qL1vnyau7c1L5cIzFAy+ACHZzP69HRqADfLV7vojIbHh2K4MhAxqVr0yRG4hRax6I9Gssi3hWhajivYGjOilGBfdqkO6+seSeFk30YXex1CP9l6Q8D8Vq3rnMIGA/dy5nEwQ7C9RGghTIpL00Bwf5kL2Gj8EP7k8m3yjj6VnjJv7TfF1Djt65LTFwXINoHjw2hZP0yPw13kEVV3ZAyISF6ma/2QYrgyEB9JvuJxbpdTzLbxmKhAJneu5ZICwdyHezfVEabE7ALE7Tcpl6ObnQ5Sm2G0pobKSUXeziDVoB mo vadiagem, libertinagem, sexo, drogas e a realidade da vida no gueto, construindo uma narrativa que transita entre os prazeres, os excessos e as contradições desse estilo de vida.\n\nUm dos grandes méritos do projeto está na sua harmonia e coesão musical. As faixas conversam entre si e ajudam a estabelecer uma identidade própria para o álbum, sem perder a espontaneidade característica do gênero. Entre os destaques, “Pimp”, “Lovesick” e “Show Me” merecem atenção especial. Cada uma apresenta diferentes facetas da sonoridade e da personalidade artística de Ben Fryez, funcionando como alguns dos momentos mais interessantes do trabalho.\n\nApesar das qualidades, S.W.A.V.E. não é isento de problemas. O principal deles está na quantidade excessiva de interlúdios, que, em determinados momentos, interrompem o fluxo do álbum e acabam desconectando o ouvinte da experiência musical. Embora possam contribuir para a ambientação e para a construção de uma narrativa, sua frequência prejudica um pouco a continuidade do projeto.\n\nNo geral, S.W.A.V.E. é um trabalho sólido, harmônico e muito bem executado. Ben Fryez consegue transformar experiências e elementos do cotidiano em um álbum com identidade, personalidade e bons momentos musicais. Os excessos nos interlúdios impedem que o disco alcance seu potencial máximo, mas não comprometem o resultado final."}, {"pub": "Complex", "score": 82, "text": "O S.W.A.V.E. é um álbum que conquista principalmente pela consistência. Ben Fryez demonstra uma preocupação clara em construir uma identidade sonora coesa, fazendo com que as faixas conversem entre si e contribuam para uma experiência que funciona melhor quando consumida do início ao fim. É um projeto que demonstra personalidade e entende muito bem sua proposta. O problema é que, em determinados momentos, parece confortável demais dentro da própria fórmula.\n\nEntre os grandes destaques está “I. WISH (feat. Kiddo Marv)”, uma das melhores músicas do projeto e, sem dúvidas, uma faixa que merecia receber tratamento de single. Tem presença, personalidade e potencial comercial sem comprometer a identidade do álbum.\n\nOutro acerto absoluto é “P.I.M.P.”, um candidato natural a smash do rap. É praticamente uma escolha incontestável de single, com todos os elementos necessários para se tornar um dos momentos mais reconhecíveis do projeto.\n\nMas talvez o momento mais interessante esteja na sequência de “Strings-N-Flutes” e “Let’s Drive To Vegas”. A transição entre as duas é impecável e reforça a sensação de que estamos diante de um álbum pensado como um corpo único, e não apenas uma coleção de músicas reunidas.\n\n“Chapter Six” também merece destaque especial: um verdadeiro hino e uma das melhores faixas do repertório. Já “All That 90s Flava” acrescenta outro momento bastante interessante, reforçando a identidade nostálgica do projeto.\n\nEntretanto, é justamente essa identidade tão bem estabelecida que acaba se tornando uma limitação. Conforme o álbum avança, a experiência começa a apresentar sinais de desgaste. A ausência de maiores experimentações e inovações sonoras faz com que determinadas faixas pareçam compartilhar estruturas e atmosferas excessivamente semelhantes. As melodias mudam, mas a sensação permanece praticamente a mesma.\n\nEm determinado ponto, o ouvinte começa a perceber um efeito de repetição, como se estivesse preso em um looping de músicas que, apesar de individualmente agradáveis, não oferecem estímulos suficientes para renovar a atenção. A duração do projeto também contribui para essa percepção.\n\nIsso não significa que o S.W.A.V.E. seja um álbum fraco. Muito pelo contrário. Ben Fryez entrega um trabalho consistente, com momentos memoráveis, escolhas interessantes de sequência e uma identidade artística bem definida. Sua principal fragilidade não está na falta de qualidade, mas na falta de variedade.\n\nNo fim, o S.W.A.V.E. é um álbum muito bom, mas que poderia ser ainda melhor se Ben Fryez tivesse coragem de sair um pouco da própria zona de conforto. Existe qualidade, direção artística e um repertório com potencial para render momentos memoráveis. Falta apenas aquele elemento de surpresa capaz de transformar um projeto coeso em uma experiência verdadeiramente inesquecível."}, {"pub": "Pitchfork", "score": 72, "text": "Em seu quarto álbum de estúdio, S.W.A.V.E., Ben Fryez parece determinado a estabelecer um diálogo entre diferentes gerações do hip-hop. Com referências que atravessam o boom bap dos anos 1990, o rap comercial dos anos 2000 e produções mais contemporâneas, o rapper apresenta um trabalho ambicioso, frequentemente envolvente, mas que nem sempre consegue transformar sua variedade de influências em uma experiência verdadeiramente consistente.\n\nA abertura com “Love$ick” sugere uma direção mais descontraída e experimental, enquanto “P.I.M.P.” rapidamente desloca o disco para um território de ostentação e irreverência. O contraste evidencia a versatilidade pretendida por Fryez, mas também antecipa um dos principais problemas do álbum: a dificuldade em estabelecer uma identidade sonora que vá além de suas referências.\n\nIsso não significa que faltem bons momentos. “WISH” apresenta uma energia contagiante, enquanto “Show Me” se beneficia de uma produção mais contida, na qual o instrumental e a cadência das rimas encontram um equilíbrio convincente. “Johnny P’s Caddy” figura entre os pontos altos do repertório, apostando em uma abordagem mais sofisticada e demonstrando como Fryez pode alcançar resultados expressivos quando permite que a composição se desenvolva sem excessos.\n\nA influência do hip-hop clássico também aparece de maneira particularmente interessante em “Selfish” e “all that 90s Flava”. Entretanto, o apego à nostalgia ocasionalmente limita a personalidade do projeto. Em vez de reinterpretar determinadas referências, algumas faixas parecem satisfeitas em reproduzir fórmulas já bastante familiares ao gênero. O resultado é agradável, mas nem sempre surpreendente.\n\nOutro aspecto que merece atenção é a estrutura do álbum. Os interlúdios “Keisha’s Intro” e “S.W.A.V.E. Radio” procuram estabelecer uma atmosfera inspirada nas mixtapes tradicionais, conferindo ao projeto uma proposta conceitual reconhecível. Apesar disso, sua presença não resolve a falta de continuidade entre algumas músicas. Em certos momentos, as intervenções parecem mais elementos decorativos do que componentes indispensáveis à narrativa.\n\nA sequência formada por “Strings-N-Flutes”, “Let’s Drive To Vegas” e “Show Me” evidencia tanto as qualidades quanto as limitações dessa abordagem. As produções possuem características interessantes individualmente, mas a alternância entre diferentes atmosferas nem sempre favorece a progressão do disco. Há uma sensação recorrente de que Fryez reuniu boas ideias sem necessariamente encontrar a melhor maneira de organizá-las.\n\nPor outro lado, “Chapter Six” e “Survivors Guilt” oferecem uma dimensão mais introspectiva, acrescentando densidade a um repertório que, em outros momentos, privilegia a estética em detrimento do conteúdo. São passagens importantes, sobretudo por demonstrarem que o rapper possui recursos para desenvolver uma linguagem mais pessoal e menos dependente de convenções estabelecidas.\n\nO problema de S.W.A.V.E. não está propriamente na qualidade de suas composições, mas na ausência de um direcionamento mais rigoroso. A variedade, inicialmente apresentada como uma de suas maiores virtudes, acaba diluindo parte do impacto do conjunto. Uma seleção mais enxuta e transições melhor elaboradas poderiam transformar um disco competente em um trabalho significativamente mais marcante.\n\nAinda assim, seria equivocado considerar o quarto álbum de Ben Fryez um retrocesso. Existe maturidade em sua relação com o hip-hop, assim como uma compreensão evidente das tradições que ajudaram a definir o gênero. O rapper demonstra personalidade em diferentes momentos, mesmo quando suas escolhas artísticas não alcançam a mesma precisão.\n\nS.W.A.V.E. é, portanto, um álbum de qualidades reconhecíveis e limitações igualmente evidentes. Seus melhores momentos justificam o interesse pela trajetória de Fryez, mas o projeto como um todo deixa a impressão de que suas ambições superaram a capacidade de organizá-las em uma declaração artística inteiramente convincente."}]}, {"id": "you-know-what-the-blues-are-for", "title": "YOU KNOW WHAT THE BLUES ARE FOR", "artist": "Valerie", "date": "2022-03-11", "genre": "Pop/R&B", "cover": "data:image/webp;base64,UklGRq46AABXRUJQVlA4IKI6AAAQBgGdASpYAlgCPlEokUajoqGkojSIoJAKCWVu4XbuArTnjr1up/6fms8s99nvf7t5x+tbrPyn+cv+X/k/y/+dH/Q9Yn9v/0vsG/1P/H/sF6737Ee8r93fUl+2P7G+7v/yP2V93f9V/0n7W/6f5Bv59/df+t7W3/V9lv/Cf9L//+4b/TP8r/3vaS/7/7mfDh/av+L+43td//D2AN8DmXtaNbX2P5p8rzrfzK/m/5b/jes3t1+eOovdA728A/2I8EvWM8LewL+vH/X9dPDG/C/9v2Bf6d/kf/P6uv19+N3vR+t/YR/YXrZ/uv7PH7qBxHHpMGFVF2yYPWFa/ICqi7ZMHrCtfkBVRdsmD1hWvyAqorn/tWFa/ICqi7ZMHrCtfkBVRw6/ICqi7ZMHrCtfkBVRdsmD8KxYcekwYVUXbJg9YVr8gKqOHX5AVUXbJg9YVr8gKqLtkwfhWLDj0mDCqi7ZMHrCtfkBVRw6/ICqi7ZMHrCtfkBVRdsmD8KxYcekwYVUXbJg9YVr8gKqOHX5AVUXbJfUEO2vUGkKEki7Q7Er1Yi/vWYyBWvyAqou2nMou2TB6wrKZ91eY8jmWvcJJKCCD29u52gscmmUnhoeWuwhEHyaev4PG/ICqi7ZMKQ7ZMHrCtfiThngteDHW6nkNevVXDmQnqx5hvh0wWPh6RZ6sU7Z3g8fBBzSYMKqLtlKKLtkwesK1tFCc2AMcot7wUQ8fS2M/B+PfF+l3qAQ2SUC2zFsVSHqRDMLIVEAqou2TB+FYsOPSYMKPVHcNHqLJ5f4n/2RTC0EfE12/MTkcbm+EjtHTzzFbgbpt9x+j2vyAqou2Uoou2TB6wrKV25WROHLFQfdhmRkZ/w6GykAJCO7fqoSNLxP62RifCDw55+stXHkasfuGm+FVF2yYPYMyYPWFa/HvOoUT+MsaFRw1U+MBqzvszE3BUK+jHysBMxUmtWwk+loT+YpMKwhovdBrFYsOPSYML1SYMKqLtizQB0iAGjXTJgspo6QQHbvtc8wAJBPpOnEkS1hIqySFbnBpCvz7bviTMd7tHNFiYuyYPWFbA66TBhVRdpiYRMH/xAngDwAwYQt1Zqy75C+nYnry33uwuhdxlOlzbdrevEMv4wV/QqBa/q7X4+Fqwqou2TB7BmTB6wrX4kh3K+J/6rjhpTCSwqEkY3DuJiB6HKbaaFUnZa6ET7OGdRXbTjT0kkpahmUDmBLsmD1hW1X1hWvyAqozUu0+coY+1zZA0mnQZlEw4BRr08a+VHs8xj0MR/DJxzdGff2rCtfkBeqTBhVRdsl9nxzpwNs/Kl64MPAgWTlhp+Vpn4K8H28cRIrCt1xc5+3zKLtkwesMjQesK1+QFT0y4nVm4CbRYmLGxOAQXPVL4oM/EzIp//4Gh/iXtPTik3pf+1YVr8gL1SYMKqLtkvnVIiLPjprbP/9jr8dnhusXooZmud02rXc uzGdIsZ2t6iI9HHwQPUvIYb9k6ur8Xxp6rTh1bAJY7qTFfaKDuvFjQ/LtWSLXrRRLfGXZDvvcel96FtyISfztGsTgjJ+oeId18rYi/R3tdDN0C7wuL5Qc0xjDReVMZ2lb4G1Z91U71MOjpXtJLsmd7yCw+xk3UuTPFnBMDgQ7SHkIULuDaPOt/ZPSdZ+z1ikSMoXnXpm/JrkfM0EiVPJvDV0COvyaG2zv4p3+JLlpzf/x0g1Ipq3RWAqoEL50O05/kC7HjIV64dpLlcCQ2ZXRVFc1pSAABOEXKSKAxIwVulGNSA12lEVSme0yy88ZCXnpN5iAujgVRHeXEgtFah62+LMBGlNKhbTb4rTuw5vQAHfqPPTkS7ikKLKEgojUdHd/+wc8IxhsWcnYVnz8JDDVTyTGpZV7buW1DgTyEmxej+C21qrdS1z5qDjdPTbCwUTZKVyi145hyRO8poftPdlwS8KxveJ+AExQyVASoKjFkl/IRuN5s/VcMAgWqkREj/KMzb/OtB0aTfSPAPfPewqDLSpGdRzpcSf0ALyFFAA", "reviews": [{"pub": "NME", "score": 100, "text": "A estreia de Valerie com You Know What the Blues Are For é uma verdadeira declaração de intenções. A britânica classuda apresenta um disco extremamente bem organizado, elegante e maduro, que demonstra uma compreensão impressionante de identidade artística. Mesmo sendo seu primeiro álbum, a cantora entrega uma obra com a segurança e a personalidade de alguém que já conhece muito bem o próprio espaço na indústria musical.\n\nUm dos maiores méritos do projeto é a qualidade de sua construção. As faixas se encaixam naturalmente, criando uma experiência coesa e harmoniosa, sem perder a capacidade de apresentar momentos individuais de grande destaque. É fácil imaginar diversas músicas do repertório alcançando o topo dos charts britânicos e conquistando espaço também nas paradas internacionais. Valerie demonstra um apelo comercial evidente, mas sem sacrificar a sofisticação que define sua proposta musical.\n\nEntre os grandes destaques estão “Will You Still Love Me Tomorrow”, uma interpretação envolvente que evidencia sua sensibilidade; “Smooth Operator”, que reforça a elegância e o charme presentes no projeto; e “Back to Black”, um dos momentos mais marcantes do álbum, no qual a cantora demonstra personalidade e presença artística.\n\nO resultado é um disco que vai muito além de uma boa estreia. You Know What the Blues Are For tem consistência, identidade e qualidade suficientes para colocar Valerie entre os nomes mais interessantes da música britânica atual. É uma obra que chega com força e que, considerando sua excelência e potencial de repercussão, pode se tornar uma das grandes protagonistas da próxima edição do BRIT Awards.\n\nValerie não apenas estreia: ela estabelece um padrão altíssimo para sua carreira. Um álbum praticamente impecável, elegante do início ao fim e com potencial para marcar uma geração."}, {"pub": "Billboard", "score": 85, "text": "O You Know What the Blues Are For é um daqueles álbuns que conseguem surpreender justamente por chegarem sem grandes expectativas. Valerie começa essa era cercada por uma divulgação confusa e pouco convincente, que não despertava necessariamente curiosidade sobre o projeto como um todo. Felizmente, o resultado final se mostra muito superior à impressão deixada por sua campanha promocional.\n\nO álbum é consistente, apresenta uma identidade musical bem definida e reúne diversas faixas com potencial para se tornarem clássicos instantâneos. É um trabalho que parece entender muito melhor sua própria qualidade do que a estratégia responsável por apresentá-lo ao público.\n\nUm dos maiores equívocos dessa era foi não escolher “Feeling Good” como primeiro single. A música praticamente resume tudo o que o álbum tem a oferecer: personalidade, sofisticação e uma identidade sonora marcante. Seria uma apresentação muito mais convincente para Valerie e, possivelmente, uma excelente oportunidade de estabelecer a direção artística do projeto desde o início.\n\nAinda assim, o repertório oferece boas alternativas. “Smooth Operator” é uma escolha bastante interessante para single, enquanto “Back To Black” surge como um dos grandes momentos do disco. É uma música incrível, com força suficiente para cumprir seu papel na divulgação do álbum e apresentar Valerie a um público ainda maior.\n\nOutro destaque é “Drunk On Valentine”, uma das composições mais bonitas do projeto. A combinação entre composição e produção resulta em uma faixa especialmente delicada e envolvente, demonstrando uma faceta emocional que merece ser valorizada.\n\n“I Say A Little Prayer” também merece atenção. É outra música que poderia facilmente receber tratamento de single, mas acaba esbarrando em uma questão estrutural: apesar de sua qualidade, não funciona tão bem como encerramento. A sensação é de que o álbum ainda tinha algo a oferecer, como se faltasse uma última faixa capaz de concluir verdadeiramente a experiência. O ouvinte termina com a impressão de que poderia haver mais por vir.\n\nNo geral, Valerie entrega um projeto muito mais interessante do que sua divulgação fazia parecer. Existe consistência, boas escolhas musicais e uma quantidade considerável de faixas que poderiam — e talvez ainda possam — alcançar grande reconhecimento comercial.\n\nYou Know What the Blues Are For é uma surpresa positiva e um lembrete de que uma campanha promocional pouco convincente não necessariamente representa a qualidade de um álbum. Valerie tinha em mãos um repertório forte; agora, resta aproveitar melhor esse potencial.\n\nO saldo é bastante positivo: um álbum elegante, consistente e cheio de possíveis hits, que merecia uma apresentação muito mais à altura de seu conteúdo."}, {"pub": "The Guardian", "score": 76, "text": "Em You Know What the Blues Are For, Valerie demonstra uma afinidade admirável com o soul e o R&B clássico, temperados por uma sensibilidade jazzística que atravessa praticamente toda a produção. Os arranjos instrumentais são particularmente elegantes, construídos sobre harmonias sofisticadas, texturas orgânicas e uma condução rítmica que sabe exatamente quando recuar para criar espaço e quando avançar para provocar tensão. Existe um suspense quase cinematográfico em determinadas passagens, uma ansiedade agradável que mantém o ouvinte atento ao desenvolvimento das composições. Seus vocais majestosos são, naturalmente, outro grande destaque: Valerie possui presença, controle e uma interpretação que confere personalidade até aos momentos mais contidos.\n\nTambém é evidente que a artista compreende sua assinatura sonora. Em uma indústria frequentemente obcecada por tendências passageiras, Valerie parece interessada em construir algo que não dependa das fórmulas pop mais imediatas. E consegue. O álbum apresenta uma identidade musical bastante particular, sustentada por instrumentações bem executadas e uma estética visual igualmente bonita, que complementa a atmosfera nostálgica do projeto sem parecer deslocada de sua proposta sonora.\n\nO problema começa justamente quando essa proposta precisa ir além da sonoridade. Por mais competente que seja sua execução, You Know What the Blues Are For parece excessivamente satisfeito em ser uma coleção de canções inspiradas no jazz, no soul e nas narrativas românticas tradicionais. Falta uma perspectiva mais definida sobre quem é Valerie dentro desse universo. Afinal, revisitar uma linguagem musical tão rica é uma escolha artística legítima, mas qual é a contribuição da artista para essa tradição? O que ela pretende dizer que ainda não tenha sido dito por tantas outras vozes?\n\nEm determinados momentos, a sensação é de que estamos ouvindo composições individualmente bonitas, mas que foram simplesmente reunidas sob uma mesma direção estética, sem necessariamente construir uma narrativa ou um conceito que justifique sua existência como álbum. A coesão sonora está presente, mas coesão não é sinônimo de visão artística. Existe uma diferença considerável entre saber exatamente como um disco deve soar e saber exatamente o que ele precisa comunicar. Valerie parece dominar a primeira questão, enquanto a segunda permanece consideravelmente nebulosa.\n\nNo fim, You Know What the Blues Are For é um trabalho de beleza inegável, sustentado por performances vocais excepcionais e uma instrumentação que merece atenção. Entretanto, fica a impressão de que Valerie está tão concentrada em homenagear uma tradição musical que ainda não encontrou completamente o que deseja acrescentar a ela. É um bom álbum, mas a pergunta permanece: além de soar bonito, para onde essa artista realmente pretende nos levar?"}]}, {"id": "five", "title": "5", "artist": "Jordyn", "date": "2022-03-18", "genre": "R&B", "cover": "data:image/webp;base64,UklGRv6KAABXRUJQVlA4IPKKAABQEgKdASpYAlgCPlEmj0YjoiUko7WKSKAKCWdufv5cx844a2D/YuShzvb+reeUSjb57lvrCuNfq+en1u6kdC8mbbXnl9W+cj/t+uH+neof0BPNT5sH/m/cL30f1X1Fv6l1TXo7dNBj201fn1+k/Lr0D8rPsH+F/b7/C+nB5rOzfMv+V/gT87/gf8x/2v8Z+533Z/y/+f4+/Qb/h9Qv8i/n/+h/uf7n/4n93/OX8xS53/i9RH3g+y/7T/Gfvf/mvhc/L/1vpf9kf+H/jvyS+wL+X/0//cf3L95f8x///sL/teMB+N/5H7AfAF/O/7V/xv8B/r/24+TP/n/1P+y/bH3T/TH/h/zv+o/b37CP5h/YP+P/ff8//8/9R////l97P/19xX7n///3Uv2Q//X7uEhCLtkuBvcGlKIAIAO4XADX8dCB6L8sF9BxJHzhCKH1S6Wu7cE8uS4FEi1fqwtdAU9BgV8PJAIbmRo5pTVx2UtvLBWk8/CY8mSmXbHcpvvMtRMQk9QDQV0CsjlaXcvqOfhDHz/2GMGPh00zT75kB+szoiBks3ZRsPJp0Kx0AP32BdLwjcMrwWTzOXKlTW+OXzn9GkZum0M0mWbtS1cZD6oYKbxdDnwTTYtknCJoQLOZvEqw6goB71JebERpWJsv12TSWzsDAfp0idEQ4LyrK20TDEqGt6wU2SuP7JnbWtN8MkfWCmKPuwThSY6V202WEvHQPOPkh1dR3yBrYGCVseXT+LCp9WtU4Zm1F8gTCXoB5/krvpPX3Pqw87VL/pHSQqCJmhLAeTFxIqSKI1JmLxCkojy6286OLCjvbK/OLq8+6WwjopvGYooaBDwuA8UBdBBAFCirxqroB358n6yaPp32IzKiAdKEHurgQpYBwGQG/gSnXlrekvM5l2NyDafiqg7qPVTMWI+U+ScFQSYi8V6ECz8w6rd6TNLhFF3hhEXYxPyLyXJ8llypgmth0LF6xGGSHGVwy2ahecv/fCk5O6cr8WdgH0QGYrt+ACreK6VS4XIMFVjiP86eK2C+jnWwZVAJdXqrs7t/pAjvLuoFXOMh7iZQxkuB7Tm6GaR9J2p91xfLmiECxITlzDJVdtusNFe8baKirHzhsyN/p5SDgeh8fjjaeheZX0tZsgvGGckKaWuC2k9Iur5mk8A+bdIvLafwxl4YaveKz/5spMNOn576A9SBOLapW9MM+7T+9QXUV963MBml6EVA2qV2JfSG58qMDadNZpzdOwSZgjeSdLcFdLUwCWrxaLigj+v7DFPuMBACJwnMtQ4LxxIYk96WgmPL/4equxE20oXTEAWy1++8QM5roNu8kE52KaACKsyJhmT/KwTtPAyJKRRzSiz6SzFX6IP03slEeAtNFomDbOW7gUReWC5FRA1Zr4W8ZGzSdRk7aldzJtuQ+FnC818eR3x3jQln48L/rRMQsSUpPr8x8LeFJLuOw1c8BeuX5vBCQhV+lKShVB4Rqj1lelZ9glU7nTkWqWvWWI6G8f9U8icP3/wBf7syGxsd3oiNsgrO8j6GdWAdsmFxgLCu+COPriOQXLOp4XJvpMTM9AT/ywCJgZiQ/ylZuOwpqrYBoutiKhyW3iHeRfK6AurJrYxHcuhFVGrobSjZDf+tdTLS2+6fzCDIc00D5s34yONXqbJ+Imo7Fko9v4WttNza aba entregando muito menos do que poderia. O disco é morno, pouco empolgante e, em diversos momentos, bastante cansativo.\n\nA experiência começa de maneira pouco inspirada. Até a quinta faixa, o ouvinte precisa ter uma boa dose de paciência para atravessar uma sequência de músicas maçantes, que não conseguem estabelecer uma conexão emocional ou despertar grande interesse. Falta impacto, falta variedade e, principalmente, falta aquele elemento que faz um álbum prender a atenção desde os primeiros minutos.\n\nFelizmente, o projeto começa a encontrar seu caminho ao longo da segunda metade. “Needs”, “Right Now” e “Water Fall Out of Love” são os principais destaques e representam os momentos em que Jordyn finalmente consegue entregar canções com as quais o público pode se conectar. São faixas que dão mais personalidade ao repertório e ajudam a recuperar parte do interesse perdido no início.\n\nO problema é que esses bons momentos não são suficientes para compensar inteiramente uma primeira metade tão pouco envolvente. 5 não chega a ser um fracasso, mas também está longe de representar o melhor da discografia de Jordyn. É um trabalho que possui algumas boas ideias, porém sofre com a falta de consistência e de momentos realmente memoráveis.\n\nNo fim, o quinto disco de Jordyn deixa uma sensação de oportunidade desperdiçada. Havia espaço para algo muito mais interessante, mas o resultado é apenas razoável."}, {"pub": "Consequence", "score": 71, "text": "O 5 é um álbum que conquista pela atmosfera. Jordyn apresenta um projeto com uma identidade sonora muito particular, capaz de transportar o ouvinte para um universo próprio. É um trabalho etéreo, delicado e extremamente agradável de acompanhar, com uma sonoridade que parece funcionar melhor quando apreciada como uma experiência completa, e não necessariamente faixa por faixa.\n\nExiste uma qualidade quase imersiva na produção, como se o álbum criasse seu próprio ambiente e convidasse o ouvinte a permanecer nele durante toda a duração. É, sem dúvidas, um dos maiores acertos do projeto. Entretanto, essa mesma característica acaba evidenciando sua principal limitação: falta impacto.\n\nEm nenhum momento o álbum parece realmente explodir. Falta aquela faixa que interrompe a experiência e faz o ouvinte pensar imediatamente: “que música é essa?”. Existem boas músicas, mas poucos momentos capazes de provocar uma reação verdadeiramente arrebatadora.\n\n“You Right” é um dos destaques do repertório, enquanto “Need To Know”, escolhida como single, apresenta um dos momentos mais catchy do projeto e demonstra que Jordyn também consegue entregar músicas com apelo mais imediato. São faixas que ajudam a quebrar a linearidade de uma experiência que, em determinados momentos, parece confortável demais em sua própria atmosfera.\n\nOutro ponto que prejudica o resultado é o excesso de músicas midtempo. Embora essa escolha contribua para a unidade sonora, acaba tornando a experiência um pouco previsível. Depois de algumas faixas, a sensação é de que o álbum permanece constantemente na mesma intensidade, sem grandes mudanças de dinâmica ou momentos de elevação.\n\nAinda assim, existem outros acertos importantes. “Selective Memories” é uma música muito boa e, inclusive, teria potencial para funcionar como faixa-título, representando muito bem a identidade e a proposta do projeto. Já “Sativa” encerra o álbum de maneira bastante satisfatória, sendo uma ótima escolha para finalizar essa viagem sonora.\n\nNo fim, o 5 é um álbum agradável, bem construído e com uma identidade artística interessante. Jordyn consegue criar um universo próprio e sustentar uma atmosfera que poucos projetos conseguem reproduzir com tanta naturalidade. O problema é que atmosfera, por si só, não sustenta tudo. Faltam contrastes, ousadia e, principalmente, aqueles momentos que fazem um álbum ultrapassar a barreira de simplesmente ser bom.\n\nO 5 é uma experiência sonora deliciosa, mas que acaba deixando a sensação de que poderia ter entregado muito mais. É um álbum que você gosta de ouvir, aprecia pela estética e reconhece pela consistência, mas dificilmente termina com a sensação de ter acabado de ouvir algo extraordinário."}, {"pub": "Rolling Stone", "score": 90, "text": "Majestoso é talvez a palavra mais adequada para descrever 5. Jordyn inicia o projeto com uma produção surpreendente, transportando o ouvinte para uma espécie de jornada galáctica, como se cada faixa representasse uma nova camada de uma dimensão desconhecida. Carregado de sintetizadores atmosféricos, texturas etéreas e vocais angelicais, o álbum constrói uma paisagem sonora que parece flutuar entre o R&B alternativo e uma experiência quase transcendental. Não é apenas uma questão de estética: existe um cuidado notável na maneira como as melodias, harmonias e camadas instrumentais se complementam para sustentar essa sensação de imersão.\n\n“Alone in the Universe” estabelece essa identidade logo nos primeiros minutos, funcionando como uma introdução particularmente eficiente ao universo que Jordyn pretende construir. A partir daí, “Life’s Too Short”, “Selective Memories”, “Water Fall Out of Love”, “Break My Heart” e “9”, com Naomi Coleman, seguem a proposta com uma consistência impressionante. As produções são magnificamente trabalhadas, alternando momentos de maior densidade eletrônica e synth com passagens mais delicadas, sem comprometer a unidade estética. É um daqueles discos em que a escolha de um sintetizador, a sobreposição de um vocal ou uma progressão melódica parecem ter sido pensadas para ocupar exatamente aquele espaço.\n\nMas o maior triunfo de 5 está em conseguir equilibrar ambição sonora e competência composicional. Jordyn não se esconde atrás de uma produção grandiosa: suas melodias são envolventes, suas interpretações carregam sensibilidade e suas composições demonstram uma maturidade que merece reconhecimento. “Life’s Too Short”, em particular, evidencia suas habilidades como compositora solo, provando que a artista consegue sustentar uma faixa não apenas pela atmosfera instrumental, mas pela força de sua construção melódica e narrativa. Existe algo especialmente interessante na maneira como o álbum desperta curiosidade sobre aquilo que está sendo descrito, fazendo com que o ouvinte queira permanecer naquele universo por mais alguns minutos.\n\nA única ressalva aparece na reta final. Existe uma pequena falha de engenharia na sequência da tracklist: “Needs” e “Need to Know”, posicionadas consecutivamente, acabam enfraquecendo o acabamento de um projeto que até então demonstrava um cuidado quase obsessivo com sua apresentação. Embora sejam boas canções individualmente, a proximidade dos títulos transmite uma impressão de pouca criatividade na organização do repertório — ou, no mínimo, de uma revisão final que poderia ter recebido um pouco mais de atenção. É um detalhe pequeno, mas perceptível em um álbum cuja maior qualidade está justamente na precisão de suas escolhas.\n\nAinda assim, 5 representa o melhor trabalho de Jordyn até aqui. É uma obra ambiciosa, atmosférica e extremamente bem executada, que compreende a importância de construir uma identidade sonora sem sacrificar a composição em nome do espetáculo. Se existe um universo particular que a artista deseja apresentar, aqui ela finalmente parece ter encontrado a maneira perfeita de fazê-lo. A pequena inconsistência no encerramento não é suficiente para comprometer uma experiência tão bem construída."}]}, {"id": "pixel", "title": "Pixel", "artist": "Slay", "date": "2022-03-18", "genre": "Pop/R&B", "cover": "data:image/webp;base64,UklGRjgFAQBXRUJQVlA4ICwFAQBQDwKdASpYAlgCPlEgjUSjoiEWP0w8OAUEsrdxpZpXORhmm0Zu766exKN3kvwyfg7lO5vNTe+/8Prr/pf/B9iToN+c3zYfU9/YfRy6tPesPKq1XNSfwF/IvnX8z/bf8l+zvx6/WuEv07+A/ab1B/on5J/v/5fz7/Z7xL+Rf1B7Av5p/ZPvf9jr2z/xf4H/U95tmP9h/8n+G/0nuC+yv1X/u/33/VfuL7nXsn/a/zn+m9gvzH+0f+X/GfAB/Ov7R/6v8d6i/3X9mfIU+df3D9mPgB/m/9n/9v+G/03wgft//U/xf+r/bD/////4I/m/9r/7X+J/1f7g//////oF/Of7n/5/8h/sPeb//n+o/3PxP/Zz//f6n/f ume o protagonismo. É provavelmente um dos elementos mais interessantes da faixa, ainda que sua melodia não tenha o mesmo poder de fixação. Existe uma riqueza sonora que merece ser reconhecida, mesmo quando a composição não acompanha completamente o potencial instrumental.\n\nMas o grande momento do álbum é, sem dúvidas, “2 Sweet”. A faixa é simplesmente maravilhosa. O refrão explode de maneira irresistível, criando um dos pontos mais altos de todo o repertório. É uma música que consegue equilibrar personalidade, energia e apelo imediato, tornando-se facilmente uma das favoritas do projeto.\n\n“Topdown” também merece elogios. É uma música muito boa, com força própria e bastante interessante musicalmente. A ressalva fica por conta de sua posição na tracklist: colocá-la imediatamente depois de “2 Sweet” parece interromper um pouco a energia construída pela faixa anterior. Talvez funcionasse melhor em outro momento do álbum.\n\nNa reta final, “Pixxxie” aparece como outro grande acerto. Um verdadeiro hino, com potencial para funcionar muito bem como single, especialmente ao lado de “Bible”, que apresenta uma abordagem catchy e reforça o lado mais acessível do projeto.\n\nNo conjunto, o PIXEL funciona muito bem justamente por não depender de uma fórmula comercial. Slay entrega um álbum com produções ousadas, escolhas interessantes e diferenciais que ajudam a destacar o projeto em meio a tantos lançamentos que parecem seguir caminhos semelhantes. Talvez não seja um disco pensado para dominar as rádios convencionais, mas certamente apresenta elementos que o tornam artisticamente interessante.\n\nO PIXEL é um álbum que cresce conforme avança e recompensa o ouvinte disposto a embarcar em sua proposta. Apesar de uma abertura pouco inspirada e de alguns pequenos problemas de sequência, Slay entrega um trabalho criativo, cheio de personalidade e com momentos genuinamente excelentes."}]}, {"id": "aqua-blue", "title": "Aqua Blue", "artist": "Hazel", "date": "2022-03-25", "genre": rução da tracklist merece elogios especiais: as transições entre as músicas são impecáveis e contribuem para uma experiência fluida e muito bem conectada.\n\nEntre os maiores destaques está “Focus”, que facilmente se estabelece como o ponto alto do álbum. A faixa apresenta uma energia irresistível e uma identidade que se destaca dentro do repertório. Ao lado dela, “Hypnotize”, o single principal, representa muito bem a proposta comercial do projeto e demonstra o potencial de Hazel para conquistar ouvintes fora do mercado de K-pop.\n\nEntretanto, existe uma questão que chama atenção ao longo do álbum: a definição de seu público-alvo. Algumas músicas, como “Do The Dance”, parecem direcionadas a um público consideravelmente mais jovem, enquanto outras, como “I’m Not Here To Make Friends”, apresentam uma abordagem muito mais madura e sofisticada. Essa diferença não compromete a coesão musical, mas deixa dúvidas sobre qual imagem Hazel pretende estabelecer internacionalmente.\n\nOutro ponto importante é o caráter extremamente comercial do projeto. Em determinados momentos, AQUA BLUE parece recorrer a fórmulas pop bastante conhecidas, chegando a soar genérico. Embora isso não prejudique necessariamente sua capacidade de entretenimento, acaba limitando seu impacto artístico. Falta ousadia, experimentação e algum elemento verdadeiramente inovador que faça o álbum se destacar em meio a tantos outros lançamentos do gênero.\n\n“After Like” merece destaque por seu potencial de viralização e capacidade de se transformar em um grande sucesso. É o tipo de faixa com apelo imediato, energia contagiante e potencial para ultrapassar os limites do próprio fandom.\n\nNo geral, AQUA BLUE funciona muito bem como experiência musical. É um álbum com boas músicas, identidade própria, excelente coesão e uma sequência muito bem construída. Sua principal fragilidade não está na execução, mas na falta de originalidade e na dificuldade de compreender exatamente qual público Hazel deseja atingir com essa variedade de abordagens.\n\nAQUA BLUE é divertido, contagiante e muito agradável de ouvir, mas também é um projeto que parece jogar pelo seguro. Hazel demonstra potencial para o mercado internacional, porém ainda precisa encontrar maneiras de transformar sua identidade em algo verdadeiramente singular."}, {"pub": "Pitchfork", "score": 60, "text": "Em seu sexto álbum de estúdio, Aqua Blue, Hazel entrega um trabalho de K-pop que começa sem grandes impressões e termina praticamente da mesma maneira. O disco sofre com uma quantidade excessiva de melodias infantilizadas, que tornam a experiência de audição cansativa e, em determinados momentos, bastante maçante. A sensação é de que o álbum insiste em uma fórmula açucarada que, em vez de conquistar o ouvinte, acaba desgastando sua paciência.\n\nO grande problema está na expectativa criada por faixas como “Hypnotize” e “Focus”. Ambas funcionam como verdadeiras iscas, sugerindo um álbum com produções e melodias mais interessantes, dinâmicas e envolventes. Entretanto, para quem chega ao disco esperando encontrar outras músicas nessa mesma direção, a surpresa é bastante negativa. O restante do repertório raramente consegue alcançar o potencial apresentado por esses dois momentos.\n\n“I’m Not Here to Make Friends” acaba sendo uma boa representação dessa experiência: é como comer um salgado em uma festa que oferece exclusivamente doces com quantidades absurdas de açúcar, além de dois doces azedos — justamente os singles — que, apesar de destoarem do restante, são os únicos capazes de despertar algum interesse. Existe uma falta de equilíbrio no repertório, e a repetição de escolhas melódicas pouco estimulantes prejudica a identidade do projeto.\n\nNo fim, Aqua Blue é um álbum que promete mais do que consegue entregar. Com alguns momentos interessantes, mas sufocado por decisões musicais excessivamente infantis e uma sequência pouco inspirada, o sexto disco de Hazel deixa a sensação de uma oportunidade desperdiçada. É difícil encontrar motivos para retornar ao álbum depois que ele termina."}]}];
/* ============================================ */

function cls(s){return s>=70?"g":s>=50?"y":"r"}
function verdict(s){return s>=90?"Aclamação universal":s>=75?"Geralmente favorável":s>=50?"Misto ou mediano":s>=20?"Geralmente desfavorável":"Antipatia avassaladora"}
function stats(a){
 var n=a.reviews.length,sum=0,g=0,y=0,r=0;
 a.reviews.forEach(function(x){sum+=x.score;var c=cls(x.score);if(c=="g")g++;else if(c=="y")y++;else r++});
 return {n:n,avg:n?Math.round(sum/n):null,g:g,y:y,r:r};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function coverHTML(a){
 if(a.cover)return '<div class="cover"><img src="'+esc(a.cover)+'" alt="Cover of '+esc(a.title)+'"></div>';
 return '<div class="cover">'+esc(a.title.slice(0,2).toUpperCase())+'</div>';
}
function fmt(d){try{var p=d.split("-"),m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return m[+p[1]-1]+" "+(+p[2])+", "+p[0]}catch(e){return d}}
function home(){
 var list=ALBUMS.slice().sort(function(a,b){return (stats(b).avg||0)-(stats(a).avg||0)});
 var h='<h1>Top Rated Albums</h1><p class="sub">Sorted by Metascore</p><div class="grid">';
 list.forEach(function(a){
  var s=stats(a);
  h+='<a class="card" href="#'+esc(a.id)+'">'+coverHTML(a)+'<div class="meta"><span class="score '+(s.n?cls(s.avg):"")+'">'+(s.n?s.avg:"tbd")+'</span><div><div class="t">'+esc(a.title)+'</div><div class="a">'+esc(a.artist)+'</div><div class="a">'+esc(a.genre||'')+'</div></div></div></a>';
 });
 return h+'</div>';
}
function bar(label,n,total,color){
 var w=total?Math.round(n/total*100):0;
 return '<div class="row"><span class="lab">'+label+'</span><div class="bar"><i style="width:'+w+'%;background:'+color+'"></i></div><span class="n">'+n+'</span></div>';
}
function albumPage(a){
 var s=stats(a);
 var h='<a class="back" href="#">‹ All albums</a><div class="album"><div>'+coverHTML(a)+'</div><div>';
 h+='<h1>'+esc(a.title)+'</h1><div class="sub">'+esc(a.artist)+(a.genre?' · '+esc(a.genre):'')+' · '+fmt(a.date)+'</div>';
 if(s.n){
  h+='<div class="top"><span class="score big '+cls(s.avg)+'">'+s.avg+'</span><div><div class="sub" style="margin:0">Based on '+s.n+' Critic '+(s.n==1?'Review':'Reviews')+'</div></div></div>';
  h+='<div class="dist">'+bar('Positive',s.g,s.n,'var(--green)')+bar('Mixed',s.y,s.n,'var(--yellow)')+bar('Negative',s.r,s.n,'var(--red)')+'</div>';
 } else h+='<p class="sub">No critic reviews yet.</p>';
 h+='</div></div><h2>Critic Reviews</h2>';
 a.reviews.slice().sort(function(x,y){return y.score-x.score}).forEach(function(r){
  h+='<details class="rev"><summary><span class="score '+cls(r.score)+'">'+r.score+'</span><span class="pub">'+esc(r.pub)+'</span><span class="arrow">▾</span></summary><div class="txt">'+esc(r.text||r.quote||"")+'</div><div class="fn">Score: '+r.score+'</div></details>';
 });
 return h;
}
function route(){
 var id=location.hash.slice(1),app=document.getElementById("app"),a=ALBUMS.filter(function(x){return x.id===id})[0];
 app.innerHTML=a?albumPage(a):home();
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
